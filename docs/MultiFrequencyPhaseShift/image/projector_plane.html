<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝터 수직 평면</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:   'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:  'Instrument Serif', 'Noto Sans KR', serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Multi-Frequency Phase Shift · Step 2</p>
    <h1>프로젝터 수직 평면 — uProj 하나가 어떻게 3D 평면이 되는가</h1>

    <svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="projplane-title projplane-desc">
      <title id="projplane-title">프로젝터 수직 평면의 유도</title>
      <desc id="projplane-desc">정규화 프로젝터 좌표 uProj 하나가 프로젝터 이미지의 한 열에 대응하고, 그 열의 광선 다발이 프로젝터 광학중심을 지나는 평면을 이루며, 프로젝터 좌표계 위에서 그 평면이 X 나누기 Z 가 상수 a 인 조건으로 표현되어 법선이 (-1, 0, a) 가 되는 과정을 3D 사시도와 위에서 내려다본 단면도로 보여준다.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
        <marker id="arrow-soft" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ panel divider ============ -->
      <line x1="680" y1="56" x2="680" y2="592" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ============ panel headings ============ -->
      <text x="40" y="64" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">A · 3D 사시도</text>
      <text x="40" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif">uProj 하나 = 프로젝터의 한 &#8220;열&#8221; = 공간의 한 평면</text>

      <text x="700" y="64" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">B · TOP VIEW (Y축에서 내려다봄)</text>
      <text x="700" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif">그 평면의 법선이 <tspan font-family="'Geist Mono', monospace">(&#8722;1, 0, a)</tspan> 인 이유</text>

      <!-- =================================================================== -->
      <!-- PANEL A                                                             -->
      <!-- =================================================================== -->

      <!-- swept wedge = the projector plane (focal) -->
      <polygon points="150,330 602,240 602,520" fill="rgba(235,108,54,0.10)" stroke="none"/>
      <!-- the two bounding rays of the fan -->
      <line x1="150" y1="330" x2="602" y2="240" stroke="#eb6c36" stroke-width="1"/>
      <line x1="150" y1="330" x2="602" y2="520" stroke="#eb6c36" stroke-width="1"/>
      <!-- far edge of the wedge -->
      <line x1="602" y1="240" x2="602" y2="520" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- centre ray of the fan -->
      <line x1="150" y1="330" x2="602" y2="380" stroke="rgba(235,108,54,0.45)" stroke-width="0.8" stroke-dasharray="2,3"/>

      <!-- projector optical axis (Z) -->
      <line x1="150" y1="330" x2="560" y2="330" stroke="rgba(45,49,66,0.28)" stroke-width="0.8" stroke-dasharray="3,4"/>

      <!-- image plane (drawn after the wedge, in front of it) -->
      <polygon points="264,235 359,309 359,425 264,351" fill="rgba(245,245,245,0.92)" stroke="#2d3142" stroke-width="1"/>
      <!-- the highlighted column x_p -->
      <line x1="338" y1="293" x2="338" y2="409" stroke="#eb6c36" stroke-width="2.5"/>
      <!-- principal point -->
      <circle cx="312" cy="330" r="2" fill="#4f5d75"/>

      <!-- axis triad at the projector centre -->
      <line x1="150" y1="330" x2="192" y2="363" stroke="#7a8399" stroke-width="0.8" marker-end="url(#arrow-soft)"/>
      <line x1="150" y1="330" x2="150" y2="253" stroke="#7a8399" stroke-width="0.8" marker-end="url(#arrow-soft)"/>
      <text x="198" y="374" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">X</text>
      <text x="140" y="246" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">Y</text>
      <text x="566" y="326" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">Z</text>

      <!-- camera ray -->
      <line x1="51" y1="253" x2="574" y2="356" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="176" y="262" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="271" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CAMERA RAY (STEP 3)</text>

      <!-- centres -->
      <circle cx="150" cy="330" r="4.5" fill="#2d3142"/>
      <text x="118" y="352" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">C_proj</text>
      <text x="118" y="366" fill="#7a8399" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="end">프로젝터 중심</text>

      <circle cx="51" cy="253" r="4" fill="#4f5d75"/>
      <text x="44" y="238" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', monospace">C_cam</text>

      <!-- intersection point -->
      <circle cx="527" cy="347" r="4" fill="#2d3142"/>
      <rect x="466" y="316" width="130" height="12" rx="2" fill="#f5f5f5"/>
      <text x="531" y="325" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P = RAY &#8745; PLANE</text>

      <!-- column callout -->
      <line x1="338" y1="285" x2="338" y2="212" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <rect x="266" y="184" width="152" height="26" rx="3" fill="#f5f5f5" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
      <text x="342" y="194" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">x_p = uProj &#183; W_p</text>
      <text x="342" y="205" fill="#4f5d75" font-size="8" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">이 열 전체 — y는 알 수 없다</text>

      <!-- wedge label -->
      <rect x="404" y="430" width="150" height="26" rx="3" fill="#f5f5f5"/>
      <text x="479" y="440" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">프로젝터 수직 평면</text>
      <text x="479" y="452" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">C_proj + 한 열의 광선 다발</text>

      <!-- image plane label -->
      <text x="252" y="440" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="end">프로젝터</text>
      <text x="252" y="452" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="end">이미지 평면</text>
      <line x1="256" y1="437" x2="290" y2="410" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>

      <!-- panel A caption -->
      <text x="40" y="556" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans KR',sans-serif">uProj는 x 좌표만 준다 &#8212; y는 미지수다. 그래서 대응되는 것은 <tspan font-weight="600" fill="#2d3142">한 점이 아니라 한 열</tspan>이고,</text>
      <text x="40" y="574" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans KR',sans-serif">그 열의 모든 픽셀에서 나가는 광선이 C_proj를 꼭짓점으로 부채꼴처럼 펴져 <tspan font-weight="600" fill="#eb6c36">평면 하나</tspan>를 이룬다.</text>

      <!-- =================================================================== -->
      <!-- PANEL B                                                             -->
      <!-- =================================================================== -->

      <!-- axes -->
      <line x1="760" y1="460" x2="1204" y2="460" stroke="#7a8399" stroke-width="0.8" marker-end="url(#arrow-soft)"/>
      <line x1="760" y1="460" x2="760" y2="156" stroke="#7a8399" stroke-width="0.8" marker-end="url(#arrow-soft)"/>
      <text x="1210" y="464" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">Z</text>
      <text x="752" y="150" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">X</text>
      <circle cx="760" cy="460" r="6" fill="none" stroke="#7a8399" stroke-width="0.8"/>
      <circle cx="760" cy="460" r="1.8" fill="#7a8399"/>
      <text x="716" y="484" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', monospace">C_proj</text>
      <text x="716" y="498" fill="#7a8399" font-size="8" font-family="'Geist','Noto Sans KR',sans-serif">Y는 화면 밖</text>

      <!-- image plane at Z = f -->
      <line x1="910" y1="536" x2="910" y2="344" stroke="#2d3142" stroke-width="1"/>
      <text x="918" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">IMAGE PLANE (Z = f_xp)</text>
      <circle cx="910" cy="460" r="2.5" fill="#4f5d75"/>
      <text x="884" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">c_xp</text>
      <circle cx="910" cy="408" r="3.5" fill="#eb6c36"/>
      <text x="898" y="400" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">x_p</text>

      <!-- bracket for (x_p - c_xp) -->
      <path d="M 932 460 L 940 460 L 940 408 L 932 408" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <rect x="946" y="424" width="112" height="20" rx="2" fill="#f5f5f5"/>
      <text x="948" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">x_p &#8722; c_xp</text>
      <text x="948" y="442" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">= f_xp &#183; a</text>

      <!-- the plane, seen edge-on = a line X = aZ (focal) -->
      <line x1="760" y1="460" x2="1180" y2="313" stroke="#eb6c36" stroke-width="2"/>
      <circle cx="1120" cy="334" r="3" fill="#eb6c36"/>
      <rect x="1044" y="296" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1180" y="305" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">X / Z = a  (모든 점)</text>

      <!-- angle at the origin -->
      <path d="M 826 460 A 66 66 0 0 0 822 437" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="838" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">tan &#945; = a</text>

      <!-- normal (focal) -->
      <line x1="1032" y1="365" x2="1057" y2="436" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <rect x="1064" y="462" width="120" height="26" rx="3" fill="#f5f5f5" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
      <text x="1124" y="472" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">n_proj = (&#8722;1, 0, a)</text>
      <text x="1124" y="483" fill="#4f5d75" font-size="8" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">평면에 수직</text>

      <!-- derivation lines -->
      <text x="792" y="172" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">핀홀 투영&#160;&#160;&#160;&#160;x_p = f_xp &#183; (X / Z) + c_xp</text>
      <text x="792" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">&#8658;&#160;&#160;X / Z = (x_p &#8722; c_xp) / f_xp = a</text>
      <text x="792" y="228" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">&#8658;&#160;&#160;X &#8722; a&#183;Z = 0&#160;&#160;&#160;&#8212; Y는 식에 없다 = 아무 값이나 가능</text>
      <text x="792" y="256" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', monospace">&#8658;&#160;&#160;(X, Y, Z) &#183; (&#8722;1, 0, a) = 0</text>

      <!-- panel B caption -->
      <text x="700" y="556" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans KR',sans-serif">Y가 식에서 빠지므로 이 직선은 Y축 방향으로 그대로 쓸려 평면이 된다 &#8212; 그래서 <tspan font-weight="600" fill="#2d3142">&#8220;수직(vertical)&#8221; 평면</tspan>이고,</text>
      <text x="700" y="574" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans KR',sans-serif">법선에 Y 성분이 <tspan font-family="'Geist Mono', monospace">0</tspan>이다. 평면은 원점 C_proj를 지나므로 상수항도 없다.</text>

      <!-- =================================================================== -->
      <!-- FORMULA CHAIN BAND                                                  -->
      <!-- =================================================================== -->
      <line x1="40" y1="608" x2="1240" y2="608" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- arrows first -->
      <line x1="252" y1="660" x2="282" y2="660" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="660" x2="530" y2="660" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="748" y1="660" x2="778" y2="660" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="996" y1="660" x2="1026" y2="660" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <g font-family="'Geist Mono', monospace">
        <rect x="40" y="624" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="646" fill="#7a8399" font-size="8" text-anchor="middle" letter-spacing="0.14em">CORRESPONDENCE</text>
        <text x="144" y="666" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">uProj &#8712; [0, 1)</text>
        <text x="144" y="682" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">3.5절의 uproj.png</text>

        <rect x="288" y="624" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="392" y="646" fill="#7a8399" font-size="8" text-anchor="middle" letter-spacing="0.14em">DENORMALIZE</text>
        <text x="392" y="666" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">x_p = uProj &#183; W_p</text>
        <text x="392" y="682" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">픽셀 단위 열 좌표</text>

        <rect x="536" y="624" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="646" fill="#7a8399" font-size="8" text-anchor="middle" letter-spacing="0.14em">UNPROJECT</text>
        <text x="640" y="666" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">a = (x_p &#8722; c_xp) / f_xp</text>
        <text x="640" y="682" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">열의 기울기 X/Z</text>

        <rect x="784" y="624" width="208" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="888" y="646" fill="#eb6c36" font-size="8" text-anchor="middle" letter-spacing="0.14em">PLANE NORMAL</text>
        <text x="888" y="666" fill="#eb6c36" font-size="11" font-weight="600" text-anchor="middle">n_proj = (&#8722;1, 0, a)</text>
        <text x="888" y="682" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">프로젝터 좌표계</text>

        <rect x="1032" y="624" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1136" y="646" fill="#7a8399" font-size="8" text-anchor="middle" letter-spacing="0.14em">ROTATE</text>
        <text x="1136" y="666" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">n_world = R_p2w &#183; n_proj</text>
        <text x="1136" y="682" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">방향만 회전 &#8212; 평행이동 없음</text>
      </g>

      <!-- =================================================================== -->
      <!-- LEGEND                                                              -->
      <!-- =================================================================== -->
      <line x1="40" y1="724" x2="1240" y2="724" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="748" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="744" x2="148" y2="744" stroke="#eb6c36" stroke-width="2"/>
      <text x="156" y="748" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif">프로젝터 수직 평면과 그 법선</text>

      <line x1="352" y1="744" x2="380" y2="744" stroke="#2d3142" stroke-width="1"/>
      <text x="388" y="748" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif">프로젝터 이미지 평면</text>

      <line x1="560" y1="744" x2="588" y2="744" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="596" y="748" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif">카메라 레이 (Step 3에서 교차)</text>

      <line x1="828" y1="744" x2="856" y2="744" stroke="rgba(45,49,66,0.28)" stroke-width="0.8" stroke-dasharray="3,4"/>
      <text x="864" y="748" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans KR',sans-serif">광축 / 좌표축</text>
    </svg>
  </div>
</body>
</html>
